    <style>
        :root {
            --bg: #020617;
            --card-bg: #111827;
            --text: #F8FAFC;
            --accent: #38BDF8;
            --subtext: #94A3B8;
            --modal-bg: rgba(0, 0, 0, 0.95);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            background: linear-gradient(to right, #60A5FA, #A78BFA);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: var(--subtext);
            margin-top: 15px;
            letter-spacing: 2px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .thumbnail-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
            position: relative;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .video-card:hover img {
            transform: scale(1.05);
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-card:hover .play-overlay {
            opacity: 1;
        }

        .play-icon {
            width: 50px;
            height: 50px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 24px;
        }

        .info {
            padding: 24px;
            flex-grow: 1;
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }

        .description {
            font-size: 0.9rem;
            color: var(--subtext);
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--accent);
            opacity: 0.8;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10B981;
        }

        .section-title {
            width: 100%;
            max-width: 1200px;
            font-size: 1.6rem;
            font-weight: 700;
            margin: 40px 0 25px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Modal Styles */
        #videoModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-bg);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            position: relative;
            width: 95vw;
            height: 90vh;
            /* 使用高度占比而非固定比例，确保空间最大化 */
            max-width: 1800px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 100px rgba(0, 0, 0, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        #video-player-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            font-weight: bold;
            z-index: 1005;
            /* 确保在 iframe 之上 */
            background: rgba(0, 0, 0, 0.5);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .close-modal:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .loading-spinner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: var(--accent);
            font-size: 1.5rem;
            display: none;
            z-index: 1002;

        // 渲染画廊
        function renderGallery() {
            const container = document.getElementById('gallery-content');
            let html = '';

            videoData.forEach(section => {
                html += `<div class="section-title">${section.section}</div>`;
                html += `<div class="video-grid">`;

                section.videos.forEach(video => {
                    html += `
                        <div class="video-card" onclick="playVideo('${video.type}', '${video.source}')">
                            <div class="thumbnail-container">
                                <img src="${video.thumb}" alt="${video.title}">
                                <div class="play-overlay"><div class="play-icon">▶</div></div>
                            </div>
                            <div class="info">
                                <span class="tag">${video.tag}</span>
                                <div class="title">${video.title}</div>
                                <div class="description">${video.desc}</div>
                                <div class="status-bar">
                                    <div class="dot"></div>
                                    ${video.type === 'gdrive' ? 'Cloud Stream 就绪' : '本地资源'}
                                </div>
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
            });

            container.innerHTML = html;
        }

        // 播放视频逻辑
        function playVideo(type, source) {
            const modal = document.getElementById('videoModal');
            const playerContainer = document.getElementById('video-player-container');
            const spinner = document.querySelector('.loading-spinner');

            playerContainer.innerHTML = '';
            modal.style.display = 'flex';

            if (type === 'gdrive') {
                if (!source) {
                    alert("请先填入此视频的 Google Drive 文件 ID！");
                    closeModal();
                    return;
                }
                spinner.style.display = 'block';
                // 使用 Google Drive Preview 模式
                const embedUrl = `https://drive.google.com/file/d/${source}/preview`;
                playerContainer.innerHTML = `<iframe src="${embedUrl}" allow="autoplay" allowfullscreen></iframe>`;

                // 隐藏加载提示（当 iframe 加载时）
                playerContainer.querySelector('iframe').onload = () => {
                    spinner.style.display = 'none';
                };
            } else if (type === 'local') {
                // 使用 HTML5 原生播放器播放本地/GitHub Pages托管的视频
                spinner.style.display = 'none';
                playerContainer.innerHTML = `<video src="${source}" controls autoplay style="width: 100%; height: 100%; object-fit: contain;"></video>`;
            } else {
                // 其它链接
                window.open(source, '_blank');
                modal.style.display = 'none';
            }
        }

        function closeModal() {
            const modal = document.getElementById('videoModal');
            const playerContainer = document.getElementById('video-player-container');
            playerContainer.innerHTML = ''; // 停止播放
            modal.style.display = 'none';
        }

        // 事件监听
        document.querySelector('.close-modal').onclick = closeModal;
        window.onclick = (event) => {
            if (event.target == document.getElementById('videoModal')) {
                closeModal();
            }
        };

        // 初始化
        renderGallery();
    </script>
</body>

</html>
