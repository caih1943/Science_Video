    <style>
        :root {
            --bg: #020617;
            --card-bg: #111827;
            --text: #F8FAFC;
            --accent: #38BDF8;
            --subtext: #94A3B8;
            --modal-bg: rgba(0, 0, 0, 0.95);
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 60px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            text-align: center;
            margin-bottom: 60px;
        }

        h1 {
            font-size: 3rem;
            margin: 0;
            background: linear-gradient(to right, #60A5FA, #A78BFA);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 800;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: var(--subtext);
            margin-top: 15px;
            letter-spacing: 2px;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 30px;
            width: 100%;
            max-width: 1200px;
        }

        .video-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .video-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .thumbnail-container {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            overflow: hidden;
            position: relative;
        }

        .thumbnail-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .video-card:hover img {
            transform: scale(1.05);
        }

        .play-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .video-card:hover .play-overlay {
            opacity: 1;
        }

        .play-icon {
            width: 50px;
            height: 50px;
            background: var(--accent);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            font-size: 24px;
        }

        .info {
            padding: 24px;
            flex-grow: 1;
        }

        .tag {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            background: rgba(56, 189, 248, 0.1);
            color: var(--accent);
            margin-bottom: 12px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 10px;
            color: #fff;
        }

        .description {
            font-size: 0.9rem;
            color: var(--subtext);
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .status-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.8rem;
            color: var(--accent);
            opacity: 0.8;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #10B981;
        }

        .section-title {
            width: 100%;
            max-width: 1200px;
            font-size: 1.6rem;
            font-weight: 700;
            margin: 40px 0 25px;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .section-title::after {
            content: "";
            flex-grow: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        /* Modal Styles */
        #videoModal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--modal-bg);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            position: relative;
            width: 95vw;
            height: 90vh;
            /* 使用高度占比而非固定比例，确保空间最大化 */
            max-width: 1800px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 0 100px rgba(0, 0, 0, 1);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        #video-player-container {
            flex-grow: 1;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 15px;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            font-weight: bold;
            z-index: 1005;
            /* 确保在 iframe 之上 */
            background: rgba(0, 0, 0, 0.5);
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.2s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .close-modal:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.1);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            font-size: 1.5rem;
            display: none;

</head>

        function getSubfolderName(sectionObj) {
            for (const v of sectionObj.videos) {
                if (v.type === 'local' && v.source && v.source.startsWith('videos/')) {
                    const parts = v.source.split('/');
                    if (parts.length >= 3) {
                        return parts[1]; // 返回子文件夹名称，如 "岳阳楼记系列"
                    }
                }
            }
            return null;
        }

        // 关联单集白板视频与对应的子文件夹系列栏目
        const relatedSeriesMap = {
            "videos/岳阳楼记-whiteboard.mp4": { section: "岳阳楼记系列", count: 10 },
            "videos/滕王阁序-whiteboard.mp4": { section: "滕王阁序系列", count: 8 },
            "videos/前赤壁赋-whiteboard.mp4": { section: "前赤壁赋系列", count: 8 },
            "videos/后赤壁赋-whiteboard.mp4": { section: "后赤壁赋系列", count: 6 },
            "videos/洛神赋-whiteboard.mp4": { section: "洛神赋系列", count: 5 },
            "videos/正气歌-whiteboard.mp4": { section: "正气歌系列", count: 7 }
        };

        // 渲染顶部导航菜单 Menu
        function renderMenu() {
            const menuContainer = document.getElementById('category-menu');
            const totalVideos = videoData.reduce((acc, s) => acc + s.videos.length, 0);

            const folderSections = videoData.filter(s => getSubfolderName(s) !== null);
            const regularSections = videoData.filter(s => getSubfolderName(s) === null);

            let html = '';

            // 第一行：子文件夹系列专栏 Menu (videos/<子文件夹>/)
            if (folderSections.length > 0) {
                html += `<div class="menu-row">`;
                html += `<span class="menu-label highlight">📂 系列文件夹专栏 Menu：</span>`;
                folderSections.forEach(sec => {
                    const isAct = activeSection === sec.section ? 'active' : '';
                    const folderName = getSubfolderName(sec);
                    html += `
                        <button class="menu-btn folder-btn ${isAct}" onclick="selectSection('${sec.section}')" title="查看 videos/${folderName}/ 下的全部 ${sec.videos.length} 部视频">
                            📂 ${sec.section}
                            <span class="menu-count">${sec.videos.length}集</span>
                        </button>
                    `;
                });
                html += `</div>`;
            }

            // 第二行：全部视频与常规栏目 Menu
            html += `<div class="menu-row">`;
            html += `<span class="menu-label">📑 栏目分类 Menu：</span>`;
            html += `
                <button class="menu-btn ${activeSection === 'ALL' ? 'active' : ''}" onclick="selectSection('ALL')">
                    🌟 全部视频
                    <span class="menu-count">${totalVideos}</span>
                </button>
            `;
            regularSections.forEach(sec => {
                const isAct = activeSection === sec.section ? 'active' : '';
                html += `
                    <button class="menu-btn ${isAct}" onclick="selectSection('${sec.section}')">
                        ${sec.section}
                        <span class="menu-count">${sec.videos.length}</span>
                    </button>
                `;
            });
            html += `</div>`;

            menuContainer.innerHTML = html;
        }

        // 切换分类/系列 Menu
        function selectSection(sectionName) {
            activeSection = sectionName;
            renderMenu();
            renderGallery();
            const galleryEl = document.getElementById('gallery-content');
            if (sectionName !== 'ALL' && galleryEl) {
                window.scrollTo({ top: galleryEl.offsetTop - 130, behavior: 'smooth' });
            }
        }

        // 渲染画廊
        function renderGallery() {
            const container = document.getElementById('gallery-content');
            let html = '';

            // 在「全部视频」模式下，将子文件夹系列置顶优先展示，方便一眼看到新增系列
            let sectionsToRender = [];
            if (activeSection === 'ALL') {
                const folderSecs = videoData.filter(s => getSubfolderName(s) !== null);
                const otherSecs = videoData.filter(s => getSubfolderName(s) === null);
                sectionsToRender = [...folderSecs, ...otherSecs];
            } else {
                sectionsToRender = videoData.filter(s => s.section === activeSection);
            }

            sectionsToRender.forEach(section => {
                const folderName = getSubfolderName(section);
                const folderBadgeHtml = folderName
                    ? `<span class="folder-badge">📁 子目录：videos/${folderName}/ （共 ${section.videos.length} 部视频）</span>`
                    : `<span style="font-size: 0.85rem; color: #94A3B8; font-weight: 400;">共 ${section.videos.length} 部视频</span>`;

                const backAllBtn = activeSection !== 'ALL'
                    ? `<button class="menu-btn" style="margin-left:auto; font-size:0.8rem;" onclick="selectSection('ALL')">← 返回全部视频</button>`
                    : '';

                html += `<div class="section-title"><span>${folderName ? '📂 ' : ''}${section.section}</span> ${folderBadgeHtml} ${backAllBtn}</div>`;
                html += `<div class="video-grid">`;

                section.videos.forEach((video, idx) => {
                    const related = relatedSeriesMap[video.source];
                    const relatedBtnHtml = related
                        ? `<div style="margin-top: 10px;">
                               <span class="series-jump-btn" onclick="event.stopPropagation(); selectSection('${related.section}')">
                                   📂 进入「${related.section}」专栏（共 ${related.count} 集） →
                               </span>
                           </div>`
                        : '';

                    const safeTitle = video.title.replace(/'/g, "\\'");
                    const safeSec = section.section.replace(/'/g, "\\'");

                    html += `
                        <div class="video-card" onclick="playVideo('${video.type}', '${video.source}', '${safeSec}')">
                            <div class="thumbnail-container">
                                <img src="${video.thumb}" alt="${video.title}">
                                <div class="play-overlay"><div class="play-icon">▶</div></div>
                            </div>
                            <div class="info">
                                <span class="tag">${video.tag}</span>
                                <div class="title">${video.title}</div>
                                <div class="description">${video.desc}</div>
                                <div class="status-bar">
                                    <div class="dot"></div>
                                    ${video.type === 'gdrive' ? 'Cloud Stream 就绪' : (folderName ? `📂 ${folderName} · 第 ${idx + 1} 集` : '本地资源')}
                                </div>
                                ${relatedBtnHtml}
                            </div>
                        </div>
                    `;
                });

                html += `</div>`;
            });

            container.innerHTML = html;
        }

        // 播放视频逻辑（支持同系列剧集列表切换）
        function playVideo(type, source, sectionName) {
            const modal = document.getElementById('videoModal');
            const playerContainer = document.getElementById('video-player-container');
            const playlistBar = document.getElementById('modal-playlist-bar');
            const spinner = document.querySelector('.loading-spinner');

            playerContainer.innerHTML = '';
            modal.style.display = 'flex';

            if (type === 'gdrive') {
                if (!source) {
                    alert("请先填入此视频的 Google Drive 文件 ID！");
                    closeModal();
                    return;
                }
                spinner.style.display = 'block';
                const embedUrl = `https://drive.google.com/file/d/${source}/preview`;
                playerContainer.innerHTML = `<iframe src="${embedUrl}" allow="autoplay" allowfullscreen></iframe>`;
                playerContainer.querySelector('iframe').onload = () => {
                    spinner.style.display = 'none';
                };
            } else if (type === 'local') {
                spinner.style.display = 'none';
                const encodedSrc = encodeURI(source);
                playerContainer.innerHTML = `<video src="${encodedSrc}" controls autoplay style="width: 100%; height: 100%; object-fit: contain;"></video>`;
            } else {
                window.open(source, '_blank');
                modal.style.display = 'none';
                return;
            }

            // 渲染播放器底部的同系列选集菜单
            const secObj = videoData.find(s => s.section === sectionName);
            if (secObj && secObj.videos.length > 1) {
                playlistBar.style.display = 'flex';
                let plHtml = `<span class="playlist-title">📺 ${secObj.section} 选集 (${secObj.videos.length})：</span>`;
                secObj.videos.forEach((v, i) => {
                    const isCurrent = v.source === source ? 'active' : '';
                    const safeSec = secObj.section.replace(/'/g, "\\'");
                    plHtml += `
                        <button class="playlist-item ${isCurrent}" onclick="playVideo('${v.type}', '${v.source}', '${safeSec}')">
                            ${i + 1}. ${v.title}
                        </button>
                    `;
                });
                playlistBar.innerHTML = plHtml;
            } else {
                playlistBar.style.display = 'none';
                playlistBar.innerHTML = '';
            }
        }

        function closeModal() {
            const modal = document.getElementById('videoModal');
            const playerContainer = document.getElementById('video-player-container');
            const playlistBar = document.getElementById('modal-playlist-bar');
            playerContainer.innerHTML = ''; // 停止播放
            if (playlistBar) {
                playlistBar.style.display = 'none';
                playlistBar.innerHTML = '';
            }
            modal.style.display = 'none';
        }

        // 事件监听
        document.querySelector('.close-modal').onclick = closeModal;
        window.onclick = (event) => {
            if (event.target == document.getElementById('videoModal')) {
                closeModal();
            }
        };

        // 初始化
        renderMenu();
        renderGallery();
    </script>
</body>

</html>
